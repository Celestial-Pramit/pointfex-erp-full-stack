name: Clean Old Deployments

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all old production deployments (keep latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments?environment=production" --paginate --jq '.[].id' | tail -n +2 | while read -r id; do
            gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${{ github.repository }}/deployments/$id" >/dev/null 2>&1 || true
            echo "Deleted deployment $id"
          done
